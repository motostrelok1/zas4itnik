name: Validate interface
on:
  push:
    branches: [main, feat/photo-free-study-layout]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate file structure
        run: |
          test -s index.html
          test -s styles.css
          grep -q 'id="structure"' index.html
          grep -q 'id="faq"' index.html
          if grep -Eiq '<img|<form|<video' index.html; then echo 'Unexpected media or data form'; exit 1; fi
      - name: Check internal anchor targets
        run: python3 scripts/check_anchors.py
      - name: Validate editable site template
        run: |
          node --check template.js
          test -s template.html
          test -s template.css
          grep -q 'content.hero' template.js
          grep -q 'bindTabs' template.js
