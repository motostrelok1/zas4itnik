name: Validate website
on:
  push:
    branches: [main, feat/photo-free-study-layout]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website source
        run: |
          test -s index.html
          test -s template.css
          test -s template.js
          node --check template.js
          python3 scripts/check_site.py
